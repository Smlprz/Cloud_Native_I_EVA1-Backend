server:
  port: 8080

spring:
  application:
    name: ms-productos

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/productos_db}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # El esquema es responsabilidad exclusiva de Flyway (migraciones versionadas).
      # Hibernate no crea ni altera tablas.
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Parametros del IDaaS (Azure AD / Microsoft Entra ID).
# Reemplazar TENANT_ID y CLIENT_ID por los valores reales del App Registration
# (ver docs/AZURE-AD-SETUP.md). En despliegue se inyectan como variables de entorno.
azure:
  jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/discovery/v2.0/keys}
  issuer: ${AZURE_ISSUER:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/v2.0}
  audience: ${AZURE_AUDIENCE:api://REEMPLAZAR_CLIENT_ID}

security:
  cors:
    # Origen(es) del frontend, separados por coma. React (CRA) usa 3000 (o 3001 si 3000 esta ocupado).
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Roles cuando el token de Azure NO trae el claim "roles" (tenant sin App Roles).
# Listas de emails separadas por coma; el resto de usuarios queda como CLIENTE.
app:
  roles:
    admin: ${APP_ROLES_ADMIN:}
    vendedor: ${APP_ROLES_VENDEDOR:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
