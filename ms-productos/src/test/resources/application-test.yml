spring:
  datasource:
    url: jdbc:h2:mem:productos_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

# Valores ficticios: en las pruebas los tokens se simulan con spring-security-test,
# el decoder real nunca llega a contactar a Azure.
azure:
  jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
  issuer: https://login.microsoftonline.com/test-tenant/v2.0
  audience: api://test-client-id

security:
  cors:
    allowed-origins: http://localhost:4200
