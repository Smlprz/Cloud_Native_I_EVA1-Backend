server:
  port: 8080

spring:
  application:
    name: ms-carrito

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/carrito_db}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # El esquema es responsabilidad exclusiva de Flyway (migraciones versionadas).
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Comunicacion entre microservicios (dentro de la red privada de AWS).
services:
  cupones:
    # ms-cupones (opcional). Vacio = sin cupones: un checkout con cupon se rechaza con un mensaje claro.
    base-url: ${CUPONES_URL:}
  productos:
    base-url: ${SERVICES_PRODUCTOS_BASE_URL:http://localhost:8081}
  # Vacio = no se registra la orden en ms-orden (la compra funciona igual).
  ordenes:
    base-url: ${SERVICES_ORDENES_BASE_URL:}

# Parametros del IDaaS (Azure AD / Microsoft Entra ID). Ver docs/AZURE-AD-SETUP.md.
azure:
  jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/discovery/v2.0/keys}
  issuer: ${AZURE_ISSUER:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/v2.0}
  audience: ${AZURE_AUDIENCE:api://REEMPLAZAR_CLIENT_ID}

security:
  cors:
    # Origen(es) del frontend, separados por coma. React (CRA) usa 3000 (o 3001 si 3000 esta ocupado).
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Roles cuando el token de Azure NO trae el claim "roles" (tenant sin App Roles).
# Listas de emails separadas por coma; el resto de usuarios queda como CLIENTE.
app:
  roles:
    admin: ${APP_ROLES_ADMIN:}
    vendedor: ${APP_ROLES_VENDEDOR:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true

# ---------------------------------------------------------------------------
# Kafka. ms-carrito PUBLICA un evento cuando el usuario agrega o quita un producto y cuando compra.
#   ms-carrito --ITEM_AGREGADO / ITEM_ELIMINADO / COMPRA_REALIZADA--> [eventos.navegacion] --> ms-analytics-recommendations
# Si Kafka no responde, el carrito sigue funcionando (el evento se pierde y queda en el log).
# ---------------------------------------------------------------------------
kafka:
  publish-enabled: ${KAFKA_PUBLISH_ENABLED:true}
  # Los 3 brokers: si uno cae, el cliente usa los otros (KAFKA_BOOTSTRAP_SERVERS=ip:9092,ip:9093,ip:9094).
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
  topics:
    navegacion: eventos.navegacion
