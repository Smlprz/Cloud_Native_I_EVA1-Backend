server:
  port: 8080

spring:
  application:
    name: ms-orden

  rabbitmq:
    # Cluster: SPRING_RABBITMQ_ADDRESSES="host1:5672,host2:5673" (el cliente prueba el siguiente
    # nodo si uno cae). Si no se define, se usa un solo nodo con HOST/PORT como antes.
    addresses: ${SPRING_RABBITMQ_ADDRESSES:${SPRING_RABBITMQ_HOST:localhost}:${SPRING_RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # ACK explicito: lo gestiona AckSupport (ack / reintento / nack hacia la DLQ).
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/orden_db}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# ---------------------------------------------------------------------------
# Contrato de mensajeria de Pedidos360 (identico en todos los microservicios).
# Unico lugar donde se escriben nombres de exchanges, colas y routing keys.
#
#   ms-orden --orden.creada----> [pedidos.exchange: direct] --> orden.creada    --> ms-notificaciones (correo)
#   ms-orden --stock.descontar-> [pedidos.exchange: direct] --> stock.descontar --> ms-productos (descuenta stock)
#   ms-productos --stock.bajo--> [pedidos.eventos:  topic ] --> stock.bajo      --> ms-notificaciones (alerta)
#   Mensaje rechazado en cualquier cola --> [pedidos.dlx: direct] --> <cola>.dlq
# ---------------------------------------------------------------------------
messaging:
  exchanges:
    direct: pedidos.exchange
    topic: pedidos.eventos
    dlx: pedidos.dlx
  queues:
    orden-creada: orden.creada
    stock-descontar: stock.descontar
    stock-bajo: stock.bajo
    resena-creada: resena.creada
    pago-procesado: pago.procesado
    cupon-usado: cupon.usado
  dlqs:
    orden-creada: orden.creada.dlq
    stock-descontar: stock.descontar.dlq
    stock-bajo: stock.bajo.dlq
    resena-creada: resena.creada.dlq
    pago-procesado: pago.procesado.dlq
    cupon-usado: cupon.usado.dlq
  routing-keys:
    orden-creada: orden.creada
    stock-descontar: stock.descontar
    stock-bajo: stock.bajo
    resena-creada: resena.creada
    pago-procesado: pago.procesado
    cupon-usado: cupon.usado
  retry:
    max-attempts: ${MESSAGING_RETRY_MAX_ATTEMPTS:3}
    backoff-ms: ${MESSAGING_RETRY_BACKOFF_MS:2000}

# Parametros del IDaaS (Azure AD / Microsoft Entra ID). Ver docs/AZURE-AD-SETUP.md.
azure:
  jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/discovery/v2.0/keys}
  issuer: ${AZURE_ISSUER:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/v2.0}
  audience: ${AZURE_AUDIENCE:api://REEMPLAZAR_CLIENT_ID}

security:
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

app:
  roles:
    admin: ${APP_ROLES_ADMIN:}
    vendedor: ${APP_ROLES_VENDEDOR:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
