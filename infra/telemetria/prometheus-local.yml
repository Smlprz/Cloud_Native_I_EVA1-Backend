# Prometheus del entorno local (docker-compose.telemetria.yml). Los microservicios se levantan con
# docker-compose.yml y docker-compose.kafka.yml y publican sus puertos en el host.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pedidos360
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: { servicio: ms-productos }
      - targets: ["host.docker.internal:8082"]
        labels: { servicio: ms-carrito }
      - targets: ["host.docker.internal:8083"]
        labels: { servicio: ms-auth }
      - targets: ["host.docker.internal:8084"]
        labels: { servicio: ms-notificaciones }
      - targets: ["host.docker.internal:8085"]
        labels: { servicio: ms-orden }
      - targets: ["host.docker.internal:8086"]
        labels: { servicio: ms-resenas }
      - targets: ["host.docker.internal:8087"]
        labels: { servicio: ms-rabbit-admin }
      - targets: ["host.docker.internal:8088"]
        labels: { servicio: ms-pago }
      - targets: ["host.docker.internal:8089"]
        labels: { servicio: ms-analytics-recommendations }
      - targets: ["host.docker.internal:8091"]
        labels: { servicio: ms-kafka-admin }
      - targets: ["host.docker.internal:8092"]
        labels: { servicio: ms-cupones }
