# EC2 - ORDENES (ms-orden)
#
#   PRODUCTOS_EC2_HOST=<ip-ec2-productos> RABBITMQ_EC2_HOST=<ip-ec2-rabbitmq> sudo docker compose up -d
#
# Se conecta a la MySQL que vive en la EC2 de productos (esquema orden_db).
# Antes de levantarlo, crear el esquema en esa MySQL (ver README de ms-orden).
# Security Group de esta EC2: abrir 8085.

services:
  ms-orden:
    image: ${DOCKERHUB_USER:-tukionbush}/pedidos360-ms-orden:${IMAGE_TAG:-3.0}
    container_name: pedidos360-ms-orden
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${PRODUCTOS_EC2_HOST}:3307/orden_db
      SPRING_DATASOURCE_USERNAME: pedidos
      SPRING_DATASOURCE_PASSWORD: pedidos
      SPRING_RABBITMQ_ADDRESSES: ${RABBITMQ_EC2_HOST:-localhost}:5672,${RABBITMQ_EC2_HOST:-localhost}:5673
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      AZURE_JWK_SET_URI: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/v2.0/keys
      AZURE_ISSUER: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
      AZURE_AUDIENCE: ${AZURE_AUDIENCE:-api://054a13aa-d3c3-4155-9b83-d3b1c964d7ae}
      SECURITY_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:3001,https://100-63-104-24.nip.io}
      APP_ROLES_ADMIN: ${APP_ROLES_ADMIN:-}
      APP_ROLES_VENDEDOR: ${APP_ROLES_VENDEDOR:-}
    ports:
      - "8085:8080"
