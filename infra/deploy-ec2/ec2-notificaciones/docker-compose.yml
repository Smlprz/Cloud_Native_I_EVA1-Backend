# EC2 #4 - NOTIFICACIONES (correo de confirmacion de pedido)
#
#   GMAIL_USERNAME=tu-correo@gmail.com GMAIL_APP_PASSWORD=xxxxxxxxxxxxxxxx sudo -E docker compose up -d --build
#
# No necesita base de datos ni conexion a las otras EC2: es stateless.
# Security Group de esta EC2: abrir 8084.

services:
  ms-notificaciones:
    build: ../../../ms-notificaciones
    container_name: pedidos360-ms-notificaciones
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST: ${RABBITMQ_EC2_HOST:-localhost}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      AZURE_JWK_SET_URI: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/v2.0/keys
      AZURE_ISSUER: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
      AZURE_AUDIENCE: api://ce3e5b61-0b01-4a67-a42b-f15ccb364024
      APP_ROLES_ADMIN: ${APP_ROLES_ADMIN:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    ports:
      - "8084:8080"
