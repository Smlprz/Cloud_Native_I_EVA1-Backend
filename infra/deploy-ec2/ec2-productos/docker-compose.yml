# EC2 #1 - PRODUCTOS  (aloja tambien la instancia MySQL de todo el sistema)
#
#   sudo docker compose up -d --build
#
# Security Group de esta EC2: abrir 8081 (API) y 3307 (MySQL, para las otras EC2).

services:
  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  ms-productos:
    build: ../../../ms-productos
    container_name: pedidos360-ms-productos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/productos_db
      SPRING_DATASOURCE_USERNAME: pedidos
      SPRING_DATASOURCE_PASSWORD: pedidos
      AZURE_JWK_SET_URI: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/v2.0/keys
      AZURE_ISSUER: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
      AZURE_AUDIENCE: api://ce3e5b61-0b01-4a67-a42b-f15ccb364024
      SECURITY_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:3001}
      APP_ROLES_ADMIN: ${APP_ROLES_ADMIN:-}
      APP_ROLES_VENDEDOR: ${APP_ROLES_VENDEDOR:-}
    ports:
      - "8081:8080"

volumes:
  mysql_data:
