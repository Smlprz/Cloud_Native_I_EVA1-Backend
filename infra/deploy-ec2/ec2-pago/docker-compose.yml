# EC2 - PAGOS Y ANTIFRAUDE (ms-pago)
#
#   PRODUCTOS_EC2_HOST=<ip-ec2-productos> ORDENES_URL=http://<ip-ec2-orden>:8085 \
#   KAFKA_EC2_HOST=<ip-ec2-kafka> sudo -E docker compose up -d
#
# - Guarda los pagos en la MySQL de la EC2 de productos (esquema pago_db; el script mysql-init lo crea).
# - Consulta la orden en ms-orden (reenvia el JWT del usuario: el monto sale de la orden).
# - Publica el resultado de cada pago en el topico Kafka eventos.pagos (3 brokers).
# - CARD_HASH_PEPPER: texto secreto que se mezcla con el numero de tarjeta antes del hash. Definirlo en un .env
#   (no se sube al repo) y no cambiarlo despues, o la regla antifraude pierde la memoria de las tarjetas.
# Security Group de esta EC2: abrir 8088.

services:
  ms-pago:
    image: ${DOCKERHUB_USER:-tukionbush}/pedidos360-ms-pago:${IMAGE_TAG:-3.0}
    container_name: pedidos360-ms-pago
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx256m}
      SPRING_DATASOURCE_URL: jdbc:mysql://${PRODUCTOS_EC2_HOST}:3307/pago_db
      SPRING_DATASOURCE_USERNAME: pedidos
      SPRING_DATASOURCE_PASSWORD: pedidos
      ORDENES_URL: ${ORDENES_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_EC2_HOST}:9092,${KAFKA_EC2_HOST}:9093,${KAFKA_EC2_HOST}:9094
      ANTIFRAUDE_MAX_INTENTOS: ${ANTIFRAUDE_MAX_INTENTOS:-3}
      ANTIFRAUDE_VENTANA_SEGUNDOS: ${ANTIFRAUDE_VENTANA_SEGUNDOS:-10}
      CARD_HASH_PEPPER: ${CARD_HASH_PEPPER:-pedidos360-pepper-solo-para-desarrollo}
      AZURE_JWK_SET_URI: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/v2.0/keys
      AZURE_ISSUER: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
      AZURE_AUDIENCE: ${AZURE_AUDIENCE:-api://054a13aa-d3c3-4155-9b83-d3b1c964d7ae}
      SECURITY_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:3001,https://100-63-104-24.nip.io}
      APP_ROLES_ADMIN: ${APP_ROLES_ADMIN:-}
      APP_ROLES_VENDEDOR: ${APP_ROLES_VENDEDOR:-}
    ports:
      - "8088:8080"
