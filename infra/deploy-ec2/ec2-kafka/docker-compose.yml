# EC2 - KAFKA: cluster de 3 nodos Zookeeper + 3 brokers + creacion de los 2 topicos del proyecto.
#
#   KAFKA_ADVERTISED_HOST=<ip-privada-de-esta-EC2> sudo -E docker compose up -d
#
# KAFKA_ADVERTISED_HOST es la direccion con la que los microservicios de OTRAS maquinas (ms-productos,
# ms-carrito...) llegan a los brokers (listener EXTERNAL, puertos 9092/9093/9094). Los contenedores de
# esta misma red (Kafka-UI, ms-kafka-admin, ms-analytics, ms-pago) usan el listener INTERNAL
# (kafka-1:29092, kafka-2:29092, kafka-3:29092). En local, sin variable, queda en localhost.
#
# Kafka-UI va en otro archivo:  sudo docker compose -f docker-compose.ui.yml up -d
# Verificar:  sudo docker exec kafka-1 kafka-topics --bootstrap-server kafka-1:29092 --describe
#
# Security Group de esta EC2:
#   22                       solo desde tu IP
#   9092, 9093, 9094         solo desde las EC2 de los microservicios (o el rango de la VPC)
#   8090 (Kafka-UI)          solo desde tu IP
#
# Topicos (3 particiones, 3 replicas, min.insync.replicas=2: soportan la caida de 1 broker sin perder datos):
#   eventos.navegacion   clickstream (ver producto, carrito, cupon, envio). Retencion 7 dias.
#   eventos.pagos        resultado de los pagos y alertas de fraude. Retencion 30 dias.
#   pagos.intentos       cada intento de compra; lo cuenta el antifraude de ms-pago. Retencion 1 dia.

name: kafka-cluster

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  environment: &zookeeper-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 10
    ZOOKEEPER_SYNC_LIMIT: 5
    ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    KAFKA_HEAP_OPTS: -Xms128m -Xmx256m

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    - zookeeper-1
    - zookeeper-2
    - zookeeper-3
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 12
    start_period: 40s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # los topicos se crean a proposito (kafka-setup / ms-kafka-admin)
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  zookeeper-1:
    <<: *zookeeper
    container_name: zookeeper-1
    hostname: zookeeper-1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1

  zookeeper-2:
    <<: *zookeeper
    container_name: zookeeper-2
    hostname: zookeeper-2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2

  zookeeper-3:
    <<: *zookeeper
    container_name: zookeeper-3
    hostname: zookeeper-3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3

  kafka-1:
    <<: *kafka
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
    volumes:
      - kafka_data_1:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9093
    volumes:
      - kafka_data_2:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9094
    volumes:
      - kafka_data_3:/var/lib/kafka/data

  # Tarea de un solo uso: crea los 3 topicos (idempotente: --if-not-exists). Termina con "Exited (0)".
  kafka-setup:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-setup
    restart: "no"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka-1:29092,kafka-2:29092,kafka-3:29092
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic eventos.navegacion \
          --partitions 3 --replication-factor 3 \
          --config retention.ms=604800000 --config cleanup.policy=delete --config min.insync.replicas=2
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic eventos.pagos \
          --partitions 3 --replication-factor 3 \
          --config retention.ms=2592000000 --config cleanup.policy=delete --config min.insync.replicas=2
        kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic pagos.intentos \
          --partitions 3 --replication-factor 3 \
          --config retention.ms=86400000 --config cleanup.policy=delete --config min.insync.replicas=2
        echo "Topicos creados:"
        kafka-topics --bootstrap-server $$BS --describe

# Red con nombre fijo para que Kafka-UI y los microservicios de esta EC2 se unan a ella.
networks:
  default:
    name: pedidos360-kafka

volumes:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
