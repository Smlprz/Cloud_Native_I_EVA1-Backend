# Cluster de RabbitMQ de Pedidos360 (2 nodos) - basado en la guia "RabbitMQ Cluster con Docker Compose".

cluster_name = pedidos360

# Formacion automatica del cluster: cada nodo busca a los de esta lista y se une al primero que responde.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Al arrancar de cero, el nodo 2 reintenta unirse al nodo 1 durante ~60 s (30 intentos x 2 s).
cluster_formation.discovery_retry_limit = 30
cluster_formation.discovery_retry_interval = 2000

# Tiempo (ms) entre limpiezas de nodos desconocidos.
cluster_formation.node_cleanup.interval = 10000

# Reparte los lideres de las colas entre los nodos (reemplaza a queue_master_location).
queue_leader_locator = balanced

# Evita que un nodo consuma toda la RAM de la maquina.
vm_memory_high_watermark.relative = 0.4
