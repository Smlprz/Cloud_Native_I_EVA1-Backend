# EC2 #2 - CARRITO
#
#   PRODUCTOS_EC2_HOST=<ip-o-dns-de-la-ec2-de-productos> sudo docker compose up -d
#
# Opcional: CUPONES_URL=http://<ip-privada-ec2-cupones>:8092 activa los cupones de descuento en el checkout.
# Opcional: ORDENES_URL=http://<ip-ec2-orden>:8085 registra cada compra en ms-orden (que publica en RabbitMQ).
# Se conecta a la MySQL y a la API de productos que viven en la EC2 #1.
# Security Group de esta EC2: abrir 8082.

services:
  ms-carrito:
    image: ${DOCKERHUB_USER:-tukionbush}/pedidos360-ms-carrito:${IMAGE_TAG:-3.0}
    # Se construye en la EC2 desde el codigo del repo (docker compose up -d --build).
    build: ../../../ms-carrito
    container_name: pedidos360-ms-carrito
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${PRODUCTOS_EC2_HOST}:3307/carrito_db
      SPRING_DATASOURCE_USERNAME: pedidos
      SPRING_DATASOURCE_PASSWORD: pedidos
      SERVICES_PRODUCTOS_BASE_URL: http://${PRODUCTOS_EC2_HOST}:8081
      SERVICES_ORDENES_BASE_URL: ${ORDENES_URL:-}
      # Cupones de descuento (ms-cupones). Vacio = sin cupones.
      CUPONES_URL: ${CUPONES_URL:-}
      AZURE_JWK_SET_URI: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/v2.0/keys
      AZURE_ISSUER: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
      AZURE_AUDIENCE: ${AZURE_AUDIENCE:-api://ce3e5b61-0b01-4a67-a42b-f15ccb364024}
      SECURITY_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:3001,https://100-63-104-24.nip.io}
      APP_ROLES_ADMIN: ${APP_ROLES_ADMIN:-}
      APP_ROLES_VENDEDOR: ${APP_ROLES_VENDEDOR:-}
      # Kafka: eventos de navegacion (topico eventos.navegacion). Los 3 brokers; si uno cae se usan los otros.
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_EC2_HOST:-localhost}:9092,${KAFKA_EC2_HOST:-localhost}:9093,${KAFKA_EC2_HOST:-localhost}:9094
    ports:
      - "8082:8080"
