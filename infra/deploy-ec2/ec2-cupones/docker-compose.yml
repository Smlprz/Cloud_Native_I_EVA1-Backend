# EC2 - CUPONES DE DESCUENTO (ms-cupones)
#
#   PRODUCTOS_EC2_HOST=<ip-privada-ec2-productos> KAFKA_EC2_HOST=<ip-privada-ec2-kafka> sudo -E docker compose up -d
#
# - Guarda los cupones en la MySQL de la EC2 de productos (esquema cupones_db; el script mysql-init lo crea).
# - ms-carrito lo llama en el checkout (CUPONES_URL=http://<ip-privada-esta-ec2>:8092 en la EC2 de carrito).
# - Publica CUPON_APLICADO en el topico Kafka eventos.navegacion (3 brokers).
# Security Group de esta EC2: abrir 8092 (el API Gateway entra por IP publica; carrito, por la privada).

services:
  ms-cupones:
    image: ${DOCKERHUB_USER:-tukionbush}/pedidos360-ms-cupones:${IMAGE_TAG:-3.0}
    # Se construye en la EC2 desde el codigo del repo (docker compose up -d --build).
    build: ../../../ms-cupones
    container_name: pedidos360-ms-cupones
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx256m}
      SPRING_DATASOURCE_URL: jdbc:mysql://${PRODUCTOS_EC2_HOST}:3307/cupones_db
      SPRING_DATASOURCE_USERNAME: pedidos
      SPRING_DATASOURCE_PASSWORD: pedidos
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_EC2_HOST}:9092,${KAFKA_EC2_HOST}:9093,${KAFKA_EC2_HOST}:9094
      AZURE_JWK_SET_URI: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/v2.0/keys
      AZURE_ISSUER: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
      AZURE_AUDIENCE: ${AZURE_AUDIENCE:-api://054a13aa-d3c3-4155-9b83-d3b1c964d7ae}
      SECURITY_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:3001,https://100-63-104-24.nip.io}
      APP_ROLES_ADMIN: ${APP_ROLES_ADMIN:-}
      APP_ROLES_VENDEDOR: ${APP_ROLES_VENDEDOR:-}
    ports:
      - "8092:8080"
