# Telemetria local: Prometheus (http://localhost:9090) y Grafana (http://localhost:3001, admin/admin).
#
#   cd infra && docker compose -f docker-compose.telemetria.yml up -d
#
# Grafana trae la fuente Prometheus y el dashboard "Pedidos360 - Microservicios" ya cargados.
name: pedidos360-telemetria

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pedidos360-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./telemetria/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pedidos360-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./telemetria/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetria/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
