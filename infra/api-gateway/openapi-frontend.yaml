  /api/pagos/webpay/iniciar:
    post:
      summary: Iniciar pago con Webpay Plus
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.218.150.42:8088/api/pagos/webpay/iniciar
