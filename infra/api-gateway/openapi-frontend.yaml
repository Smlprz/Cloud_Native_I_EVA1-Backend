# =============================================================================
# API GATEWAY DEL FRONTEND (front)
#   - Entrega la pagina web (React + Caddy en la EC2 del frontend) por HTTPS, en la raiz (stage $default).
#   - La web llama a la API del gateway del BACKEND (infra/api-gateway/openapi.yaml), que esta en OTRO dominio:
#     el navegador hace el preflight CORS y el gateway del backend solo permite este origen.
#   - Solo hay 2 gateways: este (front) y el del backend (back).
# =============================================================================
openapi: 3.0.1
info:
  title: pedidos360-frontend-api
  version: 1.0.0
  description: 'AWS API Gateway (HTTP API) DEL FRONTEND de Pedidos360: entrega la pagina web (React) por HTTPS. La web llama
    a la API del gateway del backend (pedidos360-api), en otro dominio, y el CORS de ese gateway la autoriza.'
paths:
  /:
    x-amazon-apigateway-any-method:
      summary: Pagina web (React) servida por la EC2 del frontend
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: ANY
        uri: http://100.50.134.6/
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /{proxy+}:
    parameters:
    - name: proxy+
      in: path
      required: true
      schema:
        type: string
    x-amazon-apigateway-any-method:
      summary: Archivos de la web y rutas de React (/carrito, /pedidos...)
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: ANY
        uri: http://100.50.134.6/{proxy}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
