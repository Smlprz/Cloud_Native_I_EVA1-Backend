  /api/analytics/recomendaciones:
    get:
      summary: Productos recomendados (?productoId=&limite=)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://44.193.52.211:8089/api/analytics/recomendaciones
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/analytics/perfil:
    get:
      summary: Perfil de navegacion del usuario
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://44.193.52.211:8089/api/analytics/perfil
