        payloadFormatVersion: '1.0'
  /resenas:
    get:
      summary: Listar las resenas de un producto (?productoId=)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://98.84.230.38:8086/api/resenas
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    post:
      summary: Crear una resena
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://98.84.230.38:8086/api/resenas
        connectionType: INTERNET
