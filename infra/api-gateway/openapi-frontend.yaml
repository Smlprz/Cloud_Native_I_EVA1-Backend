  /api/analytics/metricas:
    get:
      summary: Foto de las metricas (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://44.193.52.211:8089/api/analytics/metricas
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/cupones:
    get:
      summary: Listar cupones (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://3.208.89.181:8092/api/cupones
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    post:
      summary: Crear un cupon (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.208.89.181:8092/api/cupones
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/cupones/validar:
    post:
      summary: Calcular el descuento de un cupon sin consumirlo
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.208.89.181:8092/api/cupones/validar
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/cupones/{id}/activo:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    put:
      summary: Activar o desactivar un cupon (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: http://3.208.89.181:8092/api/cupones/{id}/activo
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /:
    x-amazon-apigateway-any-method:
      summary: Pagina web (React) servida por la EC2 del frontend
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: ANY
        uri: http://100.50.134.6/
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /{proxy+}:
    parameters:
    - name: proxy+
      in: path
      required: true
      schema:
        type: string
    x-amazon-apigateway-any-method:
      summary: Archivos de la web y rutas de React (/carrito, /pedidos...)
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: ANY
        uri: http://100.50.134.6/{proxy}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
