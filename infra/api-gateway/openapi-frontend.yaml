# =============================================================================
# API GATEWAY DEL FRONTEND (separado del gateway del backend)
#   - /          -> la pagina web (React + Caddy en la EC2 del frontend), con el HTTPS de AWS.
#   - /api/...   -> la API de la tienda: solo las rutas que usa la web, con el JWT Authorizer de Azure AD.
#   - Las rutas /api/... tienen prioridad sobre /{proxy+} (API Gateway elige la ruta mas especifica).
#   - CORS: el origen del propio frontend (la web y la API comparten dominio) y localhost:3000 para desarrollo.
#   - Stage $default (sin /prod): la web queda en la raiz. El frontend se compila con
#     REACT_APP_API_BASE=https://<id>.execute-api.us-east-1.amazonaws.com/api
#   - Solo hay 2 gateways: este (front) y el del backend (infra/api-gateway/openapi.yaml).
# =============================================================================
openapi: 3.0.1
info:
  title: pedidos360-frontend-api
  description: AWS API Gateway (HTTP API) DEL FRONTEND de Pedidos360. Entrega la pagina web por HTTPS en / y la API de la
    tienda en /api (solo las rutas que usa la web), validando el JWT de Azure AD en el borde. Es independiente del gateway
    del backend (pedidos360-api).
  version: 1.0.0
x-amazon-apigateway-cors:
  allowOrigins:
  - http://localhost:3000
  - https://il7nn2ok2e.execute-api.us-east-1.amazonaws.com
  allowMethods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  allowHeaders:
  - Authorization
  - Content-Type
  maxAge: 3600
components:
  securitySchemes:
    azureJwt:
      type: oauth2
      flows: {}
      x-amazon-apigateway-authorizer:
        type: jwt
        identitySource: $request.header.Authorization
        jwtConfiguration:
          issuer: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
          audience:
          - api://ce3e5b61-0b01-4a67-a42b-f15ccb364024
          - ce3e5b61-0b01-4a67-a42b-f15ccb364024
security:
- azureJwt: []
paths:
  /api/productos:
    get:
      summary: Listar catalogo (publico)
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://98.84.230.38:8081/api/productos
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    post:
      summary: Crear producto (scope productos.write + rol VENDEDOR/ADMIN, validado en el microservicio)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://98.84.230.38:8081/api/productos
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/productos/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Detalle de producto (publico)
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://98.84.230.38:8081/api/productos/{id}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    put:
      summary: Actualizar producto
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: http://98.84.230.38:8081/api/productos/{id}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    delete:
      summary: Eliminar producto (rol ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: http://98.84.230.38:8081/api/productos/{id}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/carrito:
    get:
      summary: Ver el carrito del usuario
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://3.208.89.181:8082/api/carrito
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    delete:
      summary: Vaciar el carrito
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: http://3.208.89.181:8082/api/carrito
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/carrito/items:
    post:
      summary: Agregar item al carrito
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.208.89.181:8082/api/carrito/items
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/carrito/items/{itemId}:
    parameters:
    - name: itemId
      in: path
      required: true
      schema:
        type: string
    put:
      summary: Cambiar la cantidad de un item
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: http://3.208.89.181:8082/api/carrito/items/{itemId}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    delete:
      summary: Quitar un item del carrito
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: http://3.208.89.181:8082/api/carrito/items/{itemId}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/carrito/checkout:
    post:
      summary: Confirmar el pedido
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.208.89.181:8082/api/carrito/checkout
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/carrito/pedidos:
    get:
      summary: Historial de pedidos del usuario
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://3.208.89.181:8082/api/carrito/pedidos
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/ordenes:
    get:
      summary: Listar las ordenes del usuario
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://13.220.183.124:8085/api/ordenes
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/resenas:
    get:
      summary: Listar las resenas de un producto (?productoId=)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://98.84.230.38:8086/api/resenas
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    post:
      summary: Crear una resena
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://98.84.230.38:8086/api/resenas
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/resenas/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Borrar una resena propia
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: http://98.84.230.38:8086/api/resenas/{id}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/auth/me:
    get:
      summary: Perfil del usuario autenticado (registra el acceso)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://34.201.47.100:8083/api/auth/me
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/rabbit/exchanges:
    post:
      summary: Crear un exchange
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.222.42.156:8087/api/rabbit/exchanges
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/rabbit/exchanges/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Eliminar un exchange
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: http://3.222.42.156:8087/api/rabbit/exchanges/{name}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/rabbit/queues:
    post:
      summary: Crear una cola (opcional con DLQ)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.222.42.156:8087/api/rabbit/queues
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/rabbit/queues/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Ver mensajes y consumidores de una cola
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://3.222.42.156:8087/api/rabbit/queues/{name}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    delete:
      summary: Eliminar una cola
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: http://3.222.42.156:8087/api/rabbit/queues/{name}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/rabbit/bindings:
    post:
      summary: Crear un binding cola-exchange
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.222.42.156:8087/api/rabbit/bindings
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    delete:
      summary: Eliminar un binding cola-exchange
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: http://3.222.42.156:8087/api/rabbit/bindings
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/pagos:
    get:
      summary: Pagos del usuario (?ordenId=)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://3.218.150.42:8088/api/pagos
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
    post:
      summary: Pagar una orden (el monto sale de la orden)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://3.218.150.42:8088/api/pagos
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /api/pagos/bloqueo:
    get:
      summary: Bloqueo antifraude del usuario (bloqueado, hasta)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
