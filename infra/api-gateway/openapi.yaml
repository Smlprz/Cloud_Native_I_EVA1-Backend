openapi: "3.0.1"
info:
  title: "pedidos360-api"
  description: >
    Definicion del AWS API Gateway (HTTP API) para Pedidos360.
    Punto de entrada unico hacia los microservicios de Productos y Carrito.
    Valida el JWT de Azure AD en el borde (firma via JWKS + issuer + audience).
  version: "1.0.0"

# CORS: solo el dominio del frontend puede llamar al gateway.
x-amazon-apigateway-cors:
  allowOrigins:
    - "http://localhost:3000"      # frontend en desarrollo (CRA)
    - "http://localhost:4200"      # alternativa (Angular)
    - "http://100.50.134.6"   # frontend desplegado en la EC2 (Elastic IP)
    # - "https://pedidos360.midominio.com"   # dominio real cuando exista
  allowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowHeaders:
    - Authorization
    - Content-Type
  maxAge: 3600

components:
  securitySchemes:
    azureJwt:
      type: oauth2
      flows: {}
      # Authorizer nativo de tipo JWT del HTTP API.
      x-amazon-apigateway-authorizer:
        type: jwt
        identitySource: "$request.header.Authorization"
        jwtConfiguration:
          # issuer = https://login.microsoftonline.com/<TENANT_ID>/v2.0
          issuer: "https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0"
          # audience = App ID URI o Client ID de la API (Azure v2 puede emitir cualquiera)
          audience:
            - "api://054a13aa-d3c3-4155-9b83-d3b1c964d7ae"
            - "054a13aa-d3c3-4155-9b83-d3b1c964d7ae"

# Por defecto toda ruta exige un JWT valido; el catalogo (GET) se marca publico.
security:
  - azureJwt: []

paths:

  # =========================================================
  #  Catalogo de productos  ->  EC2 :8081  /api/productos
  # =========================================================
  /productos:
    get:
      summary: Listar catalogo (publico)
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://98.84.230.38:8081/api/productos"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    post:
      summary: Crear producto (scope productos.write + rol VENDEDOR/ADMIN, validado en el microservicio)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://98.84.230.38:8081/api/productos"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /productos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Detalle de producto (publico)
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://98.84.230.38:8081/api/productos/{id}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    put:
      summary: Actualizar producto
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: "http://98.84.230.38:8081/api/productos/{id}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    delete:
      summary: Eliminar producto (rol ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://98.84.230.38:8081/api/productos/{id}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  # =========================================================
  #  Carrito / Pedidos  ->  EC2 :8082  /api/carrito   (todo protegido)
  # =========================================================
  /carrito:
    get:
      summary: Ver el carrito del usuario
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://32.197.51.142:8082/api/carrito"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    delete:
      summary: Vaciar el carrito
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://32.197.51.142:8082/api/carrito"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /carrito/items:
    post:
      summary: Agregar item al carrito
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://32.197.51.142:8082/api/carrito/items"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /carrito/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Cambiar la cantidad de un item
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: "http://32.197.51.142:8082/api/carrito/items/{itemId}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    delete:
      summary: Quitar un item del carrito
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://32.197.51.142:8082/api/carrito/items/{itemId}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /carrito/checkout:
    post:
      summary: Confirmar el pedido
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://32.197.51.142:8082/api/carrito/checkout"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /carrito/pedidos:
    get:
      summary: Historial de pedidos del usuario
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://32.197.51.142:8082/api/carrito/pedidos"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  # =========================================================
  #  Ordenes  ->  EC2 :8085  /api/ordenes   (todo protegido)
  # =========================================================
  /ordenes:
    get:
      summary: Listar las ordenes del usuario
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://3.221.149.7:8085/api/ordenes"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    post:
      summary: Crear una orden (publica el evento en RabbitMQ)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://3.221.149.7:8085/api/ordenes"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  # =========================================================
  #  Resenas  ->  EC2 :8086  /api/resenas   (todo protegido)
  # =========================================================
  /resenas:
    get:
      summary: Listar las resenas de un producto (?productoId=)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://98.84.230.38:8086/api/resenas"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    post:
      summary: Crear una resena
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://98.84.230.38:8086/api/resenas"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /resenas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Borrar una resena propia
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://98.84.230.38:8086/api/resenas/{id}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  # =========================================================
  #  Administrador de RabbitMQ  ->  EC2 :8087  /api/rabbit   (solo ADMIN, validado en el microservicio)
  # =========================================================
  /rabbit/exchanges:
    post:
      summary: Crear un exchange
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://3.222.42.156:8087/api/rabbit/exchanges"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /rabbit/exchanges/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Eliminar un exchange
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://3.222.42.156:8087/api/rabbit/exchanges/{name}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /rabbit/queues:
    post:
      summary: Crear una cola (opcional con DLQ)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://3.222.42.156:8087/api/rabbit/queues"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /rabbit/queues/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Ver mensajes y consumidores de una cola
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://3.222.42.156:8087/api/rabbit/queues/{name}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    delete:
      summary: Eliminar una cola
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://3.222.42.156:8087/api/rabbit/queues/{name}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /rabbit/bindings:
    post:
      summary: Crear un binding cola-exchange
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://3.222.42.156:8087/api/rabbit/bindings"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    delete:
      summary: Eliminar un binding cola-exchange
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://3.222.42.156:8087/api/rabbit/bindings"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  # =========================================================
  #  Identidad  ->  EC2 #3 (Elastic IP) :8083  /api/auth
  # =========================================================
  /auth/health:
    get:
      summary: Health del microservicio de identidad (publico)
      security: []
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://3.236.91.40:8083/api/auth/health"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /auth/me:
    get:
      summary: Perfil del usuario autenticado (registra el acceso)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://3.236.91.40:8083/api/auth/me"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /auth/accesos:
    get:
      summary: Historial de accesos (propios; todos si ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://3.236.91.40:8083/api/auth/accesos"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  # =========================================================
  #  Pagos y antifraude  ->  ms-pago :8088  /api/pagos
  #  201 aprobado | 402 rechazado | 429 bloqueado por antifraude | 409 orden ya pagada
  # =========================================================
  /pagos:
    get:
      summary: Pagos del usuario (?ordenId=)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://18.205.3.139:8088/api/pagos"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    post:
      summary: Pagar una orden (el monto sale de la orden)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://18.205.3.139:8088/api/pagos"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /pagos/bloqueo:
    get:
      summary: Bloqueo antifraude del usuario (bloqueado, hasta)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://18.205.3.139:8088/api/pagos/bloqueo
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /pagos/alertas-fraude:
    get:
      summary: Alertas de fraude (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: http://18.205.3.139:8088/api/pagos/alertas-fraude
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /pagos/webpay/iniciar:
    post:
      summary: Iniciar pago con Webpay Plus
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://18.205.3.139:8088/api/pagos/webpay/iniciar
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /pagos/webpay/confirmar:
    post:
      summary: Confirmar pago Webpay (retorno de Transbank)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://18.205.3.139:8088/api/pagos/webpay/confirmar
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /pagos/webpay/anular:
    post:
      summary: Anular pago Webpay (el usuario cancelo)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: http://18.205.3.139:8088/api/pagos/webpay/anular
        connectionType: INTERNET
        payloadFormatVersion: '1.0'
  /pagos/bloqueos/{usuarioId}:
    parameters:
    - name: usuarioId
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Desbloquear a un usuario (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: http://18.205.3.139:8088/api/pagos/bloqueos/{usuarioId}
        connectionType: INTERNET
        payloadFormatVersion: '1.0'

  # =========================================================
  #  Analitica y recomendaciones (Kafka)  ->  ms-analytics-recommendations :8089  /api/analytics
  #  Las metricas en tiempo real llegan por WebSocket (/ws/metricas), que el Caddy del frontend reenvia: el
  #  HTTP API de API Gateway no soporta WebSockets.
  # =========================================================
  /analytics/recomendaciones:
    get:
      summary: Productos recomendados (?productoId=&limite=)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://44.193.52.211:8089/api/analytics/recomendaciones"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /analytics/perfil:
    get:
      summary: Perfil de navegacion del usuario
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://44.193.52.211:8089/api/analytics/perfil"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /analytics/metricas:
    get:
      summary: Foto de las metricas (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://44.193.52.211:8089/api/analytics/metricas"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  # =========================================================
  #  Administrador de Kafka  ->  ms-kafka-admin :8091  /api/kafka   (solo ADMIN, validado en el microservicio)
  # =========================================================
  /kafka/cluster:
    get:
      summary: Brokers y controlador del cluster
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://44.193.52.211:8091/api/kafka/cluster"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /kafka/topics:
    get:
      summary: Listar topicos
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://44.193.52.211:8091/api/kafka/topics"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    post:
      summary: Crear un topico (particiones, replicas, retention, cleanup.policy)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://44.193.52.211:8091/api/kafka/topics"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /kafka/topics/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Describir un topico
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://44.193.52.211:8091/api/kafka/topics/{name}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    delete:
      summary: Eliminar un topico (los del sistema estan protegidos)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://44.193.52.211:8091/api/kafka/topics/{name}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /kafka/topics/{name}/config:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Cambiar la configuracion de un topico
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: "http://44.193.52.211:8091/api/kafka/topics/{name}/config"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /kafka/topics/{name}/partitions:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Aumentar las particiones de un topico
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: "http://44.193.52.211:8091/api/kafka/topics/{name}/partitions"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /kafka/consumer-groups:
    get:
      summary: Listar consumer groups
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://44.193.52.211:8091/api/kafka/consumer-groups"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /kafka/consumer-groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Estado, offsets y lag de un consumer group
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://44.193.52.211:8091/api/kafka/consumer-groups/{groupId}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    delete:
      summary: Eliminar un consumer group sin miembros
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        uri: "http://44.193.52.211:8091/api/kafka/consumer-groups/{groupId}"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  # =========================================================
  #  Cupones de descuento  ->  ms-cupones :8092  /api/cupones
  #  (POST /api/cupones/aplicar lo llama ms-carrito en el checkout por la red privada: no se expone en el gateway)
  # =========================================================
  /cupones:
    get:
      summary: Listar cupones (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: "http://32.197.51.142:8092/api/cupones"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
    post:
      summary: Crear un cupon (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://32.197.51.142:8092/api/cupones"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /cupones/validar:
    post:
      summary: Calcular el descuento de un cupon sin consumirlo
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: "http://32.197.51.142:8092/api/cupones/validar"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"

  /cupones/{id}/activo:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Activar o desactivar un cupon (solo ADMIN)
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        uri: "http://32.197.51.142:8092/api/cupones/{id}/activo"
        connectionType: INTERNET
        payloadFormatVersion: "1.0"
