server:
  port: 8080

spring:
  application:
    name: ms-cupones

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cupones_db}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# ---------------------------------------------------------------------------
# Kafka. ms-cupones PUBLICA CUPON_APLICADO cada vez que un cupon se usa en una compra.
#   ms-cupones --CUPON_APLICADO--> [eventos.navegacion] --> ms-analytics-recommendations (dashboard)
# Si Kafka no responde, el cupon igual se aplica (el evento se pierde y queda en el log).
# ---------------------------------------------------------------------------
kafka:
  publish-enabled: ${KAFKA_PUBLISH_ENABLED:true}
  # Los 3 brokers: si uno cae, el cliente usa los otros (KAFKA_BOOTSTRAP_SERVERS=ip:9092,ip:9093,ip:9094).
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
  topics:
    navegacion: eventos.navegacion

app:
  roles:
    admin: ${APP_ROLES_ADMIN:}
    vendedor: ${APP_ROLES_VENDEDOR:}

# Parametros del IDaaS (Azure AD / Microsoft Entra ID).
azure:
  jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/discovery/v2.0/keys}
  issuer: ${AZURE_ISSUER:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/v2.0}
  audience: ${AZURE_AUDIENCE:api://REEMPLAZAR_CLIENT_ID}

security:
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
