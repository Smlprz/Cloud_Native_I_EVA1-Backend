server:
  port: 8080

spring:
  application:
    name: ms-notificaciones
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  mail:
    from: ${GMAIL_USERNAME:no-reply@petshop.cl}

management:
  endpoints:
    web:
      exposure:
        include: health,info
