spring:
  rabbitmq:
    listener:
      simple:
        # Los tests no necesitan broker: los listeners no se conectan.
        auto-startup: false
  datasource:
    url: jdbc:h2:mem:pago_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

# Sin broker real: las pruebas que lo necesitan usan Kafka embebido o mockean el publicador.
kafka:
  bootstrap-servers: localhost:1

# Sin Kafka: el antifraude cuenta los intentos en el mismo proceso (sincrono) y guarda en memoria.
app:
  antifraude:
    kafka-habilitado: false
    store: memory

azure:
  jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
  issuer: https://login.microsoftonline.com/test-tenant/v2.0
  audience: api://test-client-id

security:
  cors:
    allowed-origins: http://localhost:3000
