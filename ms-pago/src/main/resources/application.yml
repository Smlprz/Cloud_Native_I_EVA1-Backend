server:
  port: 8080

spring:
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:${SPRING_RABBITMQ_HOST:localhost}:${SPRING_RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # ACK explicito: lo gestiona AckSupport (ack / reintento / nack hacia la DLQ).
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

  application:
    name: ms-pago

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pago_db}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# ---------------------------------------------------------------------------
# Kafka. Los nombres de topicos se definen UNA sola vez por servicio, aqui.
#   ms-pago --PAGO_APROBADO / PAGO_RECHAZADO / FRAUDE_BLOQUEADO--> [eventos.pagos] --> ms-analytics-recommendations
# ---------------------------------------------------------------------------
kafka:
  # Los 3 brokers: si uno cae, el cliente usa los otros (KAFKA_BOOTSTRAP_SERVERS=ip:9092,ip:9093,ip:9094).
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
  topics:
    pagos: eventos.pagos
    # Intentos de pago (compra) de cada usuario: los cuenta el grupo "antifraude" de este mismo servicio.
    intentos: pagos.intentos

# Regla antifraude: un usuario con mas de max-intentos compras dentro de la ventana queda bloqueado
# duracion-bloqueo-minutos. El bloqueo se guarda en DynamoDB (store=dynamodb) o en memoria (store=memory).
app:
  antifraude:
    max-intentos: ${ANTIFRAUDE_MAX_INTENTOS:3}
    ventana-segundos: ${ANTIFRAUDE_VENTANA_SEGUNDOS:60}
    duracion-bloqueo-minutos: ${ANTIFRAUDE_DURACION_BLOQUEO_MINUTOS:15}
    kafka-habilitado: ${ANTIFRAUDE_KAFKA_HABILITADO:true}
    grupo: antifraude
    store: ${ANTIFRAUDE_STORE:memory}
    dynamodb:
      region: ${AWS_REGION:us-east-1}
      # Solo para DynamoDB Local; en AWS se deja vacio y se usa el rol de la EC2.
      endpoint: ${DYNAMODB_ENDPOINT:}
      tabla: ${DYNAMODB_TABLA_BLOQUEOS:pedidos360-bloqueos}
    # Se mezcla con el numero de tarjeta antes de aplicar SHA-256 (el numero nunca se guarda).
    pepper: ${CARD_HASH_PEPPER:pedidos360-pepper-solo-para-desarrollo}
  # Webpay Plus. Valores por defecto = ambiente de INTEGRACION con las credenciales publicas de prueba de Transbank.
  webpay:
    base-url: ${WEBPAY_BASE_URL:https://webpay3gint.transbank.cl}
    commerce-code: ${WEBPAY_COMMERCE_CODE:597055555532}
    api-key: ${WEBPAY_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
    # Pagina del frontend a la que Webpay devuelve al usuario.
    return-url: ${WEBPAY_RETURN_URL:http://localhost:3000/pago/retorno}
  roles:
    admin: ${APP_ROLES_ADMIN:}
    vendedor: ${APP_ROLES_VENDEDOR:}

services:
  ordenes:
    base-url: ${ORDENES_URL:http://localhost:8085}

# Parametros del IDaaS (Azure AD / Microsoft Entra ID).
azure:
  jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/discovery/v2.0/keys}
  issuer: ${AZURE_ISSUER:https://login.microsoftonline.com/REEMPLAZAR_TENANT_ID/v2.0}
  audience: ${AZURE_AUDIENCE:api://REEMPLAZAR_CLIENT_ID}

security:
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true

# RabbitMQ: ms-pago --pago.procesado--> [pedidos.exchange : direct] --> pago.procesado --> ms-orden
messaging:
  exchanges:
    direct: pedidos.exchange
    topic: pedidos.eventos
    dlx: pedidos.dlx
  queues:
    orden-creada: orden.creada
    stock-descontar: stock.descontar
    stock-bajo: stock.bajo
    resena-creada: resena.creada
    pago-procesado: pago.procesado
    cupon-usado: cupon.usado
  dlqs:
    orden-creada: orden.creada.dlq
    stock-descontar: stock.descontar.dlq
    stock-bajo: stock.bajo.dlq
    resena-creada: resena.creada.dlq
    pago-procesado: pago.procesado.dlq
    cupon-usado: cupon.usado.dlq
  routing-keys:
    orden-creada: orden.creada
    stock-descontar: stock.descontar
    stock-bajo: stock.bajo
    resena-creada: resena.creada
    pago-procesado: pago.procesado
    cupon-usado: cupon.usado
  retry:
    max-attempts: ${MESSAGING_RETRY_MAX_ATTEMPTS:3}
    backoff-ms: ${MESSAGING_RETRY_BACKOFF_MS:2000}
